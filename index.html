<head>
<meta charset="utf-8">

<title>تقرير وكاد · أكتوبر</title>
<style>
  :root { --bg: #EEF1EF; --panel: #fff; --fg: #12221B; --muted: #5E6B65; --line: #D7DED9; --g: #0B3D2E; --g2: #0E5A43; --bad: #B42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1613; --panel: #17201C; --fg: #E7EEEA; --muted: #9AA8A1; --line: #2A3631; --g: #0E5A43; --g2: #2F8A68; --bad: #F97066; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; padding: 16px; }
  .box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .top { background: var(--g); color: #fff; padding: 22px 24px; }
  .top small { display: flex; align-items: center; gap: 6px; opacity: .8; font-size: 12px; }
  .top small i { width: 7px; height: 7px; border-radius: 50%; background: #5BD69B; }
  .top h1 { margin: 6px 0 0; font-size: 22px; }
  form { padding: 22px 24px 24px; display: grid; gap: 12px; }
  label { font-size: 13px; color: var(--muted); }
  input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); direction: ltr; text-align: right; }
  input:focus { outline: 2px solid var(--g2); outline-offset: 1px; }
  button { font: inherit; font-weight: 700; font-size: 15px; padding: 11px; border: 0; border-radius: 4px; background: var(--g2); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin: 0; }
</style>
</head>

</div>
